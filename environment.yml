name: functionalhomology
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11.18
  - numpy=2.4.6
  - pandas=3.1.1
  - scipy=1.17.1
  - biopython=1.88
  - matplotlib-base=3.11.2
  - requests=2.34.2
  - tqdm=4.70.1
  - pytest=9.2.0
  - goatools=1.6.9
  - diamond=2.2.8
  - openjdk=17
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.15.0+cpu
      - transformers==5.22.1
      - huggingface-hub==2.4.0
      - tokenizers==0.23.3
      - safetensors==0.8.0
